<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32"
     shape-rendering="crispEdges" role="img" aria-labelledby="title description">
  <title id="title">Armor Status NeoForge icon</title>
  <desc id="description">An original steel-blue chestplate above a segmented green durability meter with an amber depleted end, on deep navy.</desc>

  <!-- Integer rectangles form a 32-pixel grid; export at 16x with nearest-neighbor sampling. -->
  <g id="background">
    <rect x="0" y="0" width="32" height="32" fill="#101b2e"/>
    <rect x="3" y="3" width="26" height="26" fill="#142238"/>
    <rect x="3" y="3" width="18" height="1" fill="#1b2c43"/>
    <rect x="3" y="4" width="1" height="17" fill="#1b2c43"/>
  </g>

  <!-- Stepped shoulder caps and a recessed neck keep the silhouette readable at thumbnail size. -->
  <g id="silhouette" fill="#081322">
    <rect x="8" y="5" width="5" height="8"/>
    <rect x="6" y="6" width="7" height="7"/>
    <rect x="5" y="8" width="3" height="5"/>
    <rect x="19" y="5" width="5" height="8"/>
    <rect x="19" y="6" width="7" height="7"/>
    <rect x="24" y="8" width="3" height="5"/>
    <rect x="12" y="8" width="2" height="4"/>
    <rect x="18" y="8" width="2" height="4"/>
    <rect x="13" y="9" width="6" height="4"/>
    <rect x="8" y="11" width="16" height="11"/>
    <rect x="9" y="22" width="14" height="2"/>
  </g>

  <g id="shoulder-plates">
    <rect x="8" y="6" width="4" height="1" fill="#b4d0e2"/>
    <rect x="7" y="7" width="5" height="4" fill="#7fa5c3"/>
    <rect x="6" y="8" width="1" height="4" fill="#91b4cd"/>
    <rect x="7" y="7" width="1" height="3" fill="#d0e3ee"/>
    <rect x="8" y="7" width="4" height="1" fill="#b4d0e2"/>
    <rect x="7" y="11" width="5" height="1" fill="#3f5e7b"/>
    <rect x="11" y="9" width="1" height="2" fill="#6085a5"/>
    <rect x="20" y="6" width="4" height="1" fill="#91b4cd"/>
    <rect x="20" y="7" width="5" height="4" fill="#6b91b1"/>
    <rect x="20" y="7" width="4" height="1" fill="#b4d0e2"/>
    <rect x="24" y="8" width="2" height="4" fill="#3f5e7b"/>
    <rect x="23" y="8" width="1" height="3" fill="#507492"/>
    <rect x="20" y="11" width="4" height="1" fill="#304b68"/>
  </g>

  <g id="breastplate">
    <rect x="12" y="8" width="1" height="3" fill="#91b4cd"/>
    <rect x="13" y="9" width="1" height="2" fill="#b4d0e2"/>
    <rect x="14" y="10" width="4" height="1" fill="#91b4cd"/>
    <rect x="18" y="9" width="1" height="2" fill="#6b91b1"/>
    <rect x="19" y="8" width="1" height="3" fill="#507492"/>
    <rect x="9" y="12" width="14" height="9" fill="#6b91b1"/>
    <rect x="10" y="11" width="12" height="1" fill="#91b4cd"/>
    <rect x="9" y="12" width="1" height="7" fill="#b4d0e2"/>
    <rect x="10" y="12" width="2" height="6" fill="#91b4cd"/>
    <rect x="12" y="12" width="7" height="1" fill="#b4d0e2"/>
    <rect x="12" y="13" width="1" height="2" fill="#d0e3ee"/>
    <rect x="13" y="13" width="6" height="6" fill="#739cbb"/>
    <rect x="20" y="12" width="2" height="7" fill="#507492"/>
    <rect x="22" y="12" width="1" height="9" fill="#3f5e7b"/>
    <rect x="10" y="19" width="12" height="2" fill="#6085a5"/>
    <rect x="10" y="19" width="8" height="1" fill="#7fa5c3"/>
    <rect x="10" y="21" width="12" height="2" fill="#304b68"/>
    <rect x="10" y="21" width="10" height="1" fill="#507492"/>
    <rect x="10" y="21" width="1" height="1" fill="#91b4cd"/>
  </g>

  <!-- Separated bright cells read as remaining durability, not text or a copied game texture. -->
  <g id="durability-meter">
    <rect x="5" y="26" width="22" height="4" fill="#081322"/>
    <rect x="6" y="27" width="20" height="2" fill="#26364a"/>
    <rect x="7" y="27" width="3" height="2" fill="#4bc68b"/>
    <rect x="11" y="27" width="3" height="2" fill="#4bc68b"/>
    <rect x="15" y="27" width="3" height="2" fill="#4bc68b"/>
    <rect x="19" y="27" width="3" height="2" fill="#39aa78"/>
    <rect x="7" y="27" width="3" height="1" fill="#8be4ad"/>
    <rect x="11" y="27" width="3" height="1" fill="#8be4ad"/>
    <rect x="15" y="27" width="3" height="1" fill="#8be4ad"/>
    <rect x="19" y="27" width="3" height="1" fill="#6ed79c"/>
    <rect x="23" y="27" width="1" height="2" fill="#d89b48"/>
    <rect x="23" y="27" width="1" height="1" fill="#f4c477"/>
  </g>
</svg>
