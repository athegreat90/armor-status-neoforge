modLoader = "klf"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
logoBlur = false
authors = "${mod_authors}"
description = '''
Unofficial NeoForge reimplementation, written in Kotlin, inspired by ShirjeelPlays' Armor Status.
Shows your armor durability on the HUD. Client-side only.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
