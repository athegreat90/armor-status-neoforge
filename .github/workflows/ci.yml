name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Minecraft ${{ matrix.mc }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1.2", "26.2", "26.3"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java 25 is the project toolchain. ModDevGradle's asset task also needs a JDK 21 launcher,
      # which Gradle downloads on demand through the Foojay toolchain resolver.
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Explicit (also the action default): fail the job if a committed wrapper jar is not an official one.
          validate-wrappers: true

      # Spotless (ktlint) format check for all Kotlin sources and Gradle scripts.
      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Unit tests (common)
        run: ./gradlew :common:test --no-daemon

      # Compiles Kotlin, builds the jar, runs spotlessCheck again and verifyModMetadata for this target.
      - name: Build and verify (Minecraft ${{ matrix.mc }})
        run: ./gradlew check build "-PmcVersion=${{ matrix.mc }}" --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: armor-status-neoforge-mc${{ matrix.mc }}
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

      # Totals of the JUnit XML reports (one file per test class); reads only files the build produced.
      - name: Test summary
        if: always()
        env:
          MC: ${{ matrix.mc }}
        run: |
          set -- common/build/test-results/test/*.xml
          {
            echo "### Unit tests (Minecraft $MC)"
            if [ -e "$1" ]; then
              awk '
                /<testsuite / {
                  suites++
                  line = $0
                  tests += attr(line, "tests"); failures += attr(line, "failures")
                  errors += attr(line, "errors"); skipped += attr(line, "skipped")
                }
                function attr(s, name,   m) {
                  if (match(s, " " name "=\"[0-9]+\"")) {
                    m = substr(s, RSTART + length(name) + 3, RLENGTH - length(name) - 4)
                    return m + 0
                  }
                  return 0
                }
                END {
                  printf "%d suites, %d tests, %d failures, %d errors, %d skipped\n", suites, tests, failures, errors, skipped
                }' "$@"
            else
              echo "No test result files found in common/build/test-results/test."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-mc${{ matrix.mc }}
          path: |
            common/build/reports
            common/build/test-results
            neoforge/build/reports
          if-no-files-found: ignore
